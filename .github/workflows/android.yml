name: Build ImmersivePortals

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immersive-portals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmersivePortals
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Java is needed by Android SDK command-line tools,
      # but this project does NOT use Gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Java version
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/ndk-build" --version || true
          cmake --version

      # Host tests
      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-host --parallel

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest \
            --test-dir build-host \
            --output-on-failure

      # Real Android ARM64 build
      - name: Build ARM64 LeviLaunchroid package
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/package.sh
          ./scripts/package.sh

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated package..."

          find . \
            -type f \
            \( -name "*.levipack" -o -name "*.so" \) \
            -print

          PACKAGE="build-arm64-v8a/dist/arm64-v8a/immersive_portals.levipack"

          if [ ! -f "$PACKAGE" ]; then
            echo "::error::ImmersivePortals package was not generated."
            echo
            echo "Build tree:"
            find . -maxdepth 6 -type f -print | sort
            exit 1
          fi

          echo
          echo "Generated package:"
          ls -lh "$PACKAGE"

          echo
          echo "Package contents:"
          unzip -l "$PACKAGE"

      - name: Upload LeviLaunchroid package
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-levipack
          path: build-arm64-v8a/dist/arm64-v8a/immersive_portals.levipack
          if-no-files-found: error
          retention-days: 14
