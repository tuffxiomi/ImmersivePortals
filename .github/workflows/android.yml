name: Android native mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immersive-portals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmersivePortals
    runs-on: ubuntu-24.04

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v7

      # Java is required by Android SDK command-line tools
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Android SDK environment
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install exactly the Android components required by this project
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "Installed Android SDK:"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      # Host-side tests do not require Android
      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-host --target portal_core_tests --parallel

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest \
            --test-dir build-host \
            --output-on-failure

      # Build the actual ARM64 LeviLaunchroid mod
      - name: Build ARM64 LeviLaunchroid package
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          chmod +x ./scripts/package.sh
          ./scripts/package.sh

      # Verify that the package was actually produced
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="build-arm64-v8a/dist/arm64-v8a/immersive_portals.levipack"

          if [ ! -f "$PACKAGE" ]; then
            echo "::error::Expected package was not produced: $PACKAGE"
            echo "Build directory:"
            find build-arm64-v8a -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Package found:"
          ls -lh "$PACKAGE"

          echo "Package contents:"
          unzip -l "$PACKAGE"

      # Upload final artifact
      - name: Upload LeviLaunchroid package
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-levipack
          path: build-arm64-v8a/dist/arm64-v8a/immersive_portals.levipack
          if-no-files-found: error
          retention-days: 14
